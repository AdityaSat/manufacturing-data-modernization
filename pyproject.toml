[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manufacturing-data-modernization"
version = "1.0.0"
description = "Manufacturing data pipeline, failure-detection dashboard and investment business case"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5", "pandas==2.2.3", "scikit-learn==1.8.0"]

[tool.setuptools.packages.find]
where = ["src"]
